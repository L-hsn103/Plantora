<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Plantora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/register.css" />
  <script src="../script/auth.js" defer></script>
  <link rel="icon" type="image/png" href="../assets/image/Plantora_log.png" />

  <!-- set the logged in class early so the navbar doesn't flicker -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem("plantora_user") || sessionStorage.getItem("plantora_user") || "null")) {
        document.documentElement.classList.add("is-auth");
      }
    } catch (err) {}
  </script>
</head>
<body>

  <div class="register-page">

    <a href="index.html" class="register-back-link">&larr; Back to Home</a>

    <div class="register-card">
      <p class="register-card__logo"><img class="logo__img" src="../assets/image/Plantora_log.png" alt="" />Plantora</p>

      <h1>Create Account</h1>
      <p class="register-card__intro">
        Join Plantora to get personalized plant recommendations and manage your plants.
      </p>

      <!-- auth.js checks the passwords match, then signs up -->
      <form class="register-form" id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password" />
        </div>

        <button type="submit" class="btn btn--primary">Create Account</button>
      </form>

      <p class="register-card__login">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>

    <p class="register-note">This is an early prototype — registration is not yet functional.</p>
  </div>

  <script src="../script/auth-ui.js"></script>
</body>
</html>
