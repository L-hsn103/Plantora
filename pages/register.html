<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Plantora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/register.css" />
  <!-- shared animated backdrop styles (login.css holds the .login-bg layer) -->
  <link rel="stylesheet" href="../style/login.css" />
  <script src="https://unpkg.com/lucide@0.469.0" defer></script>
  <script src="../script/config.js" defer></script>
  <script src="../script/loading.js" defer></script>
  <script src="../script/auth.js" defer></script>
  <link rel="icon" type="image/png" href="../assets/image/Plantora_log.png" />

  <!-- set the logged in class early so the navbar doesn't flicker -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem("plantora_user") || sessionStorage.getItem("plantora_user") || "null")) {
        document.documentElement.classList.add("is-auth");
      }
    } catch (err) {}
  </script>
</head>
<body>

  <div class="register-page">

    <div class="login-bg" aria-hidden="true"></div>

    <a href="../index.html" class="register-back-link">&larr; Back to Home</a>

    <div class="register-card">
      <p class="register-card__logo"><img class="logo__img" src="../assets/image/Plantora_log.png" alt="" />Plantora</p>

      <h1>Create Account</h1>
      <p class="register-card__intro">
        Join Plantora to get personalized plant recommendations and manage your plants.
      </p>

      <!-- auth.js checks the passwords match, then signs up -->
      <form class="register-form" id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password" />
        </div>

        <button type="submit" class="btn btn--primary">Create Account</button>
      </form>

      <p class="register-card__login">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>
  </div>

  <script src="../script/auth-ui.js"></script>
  <script>
    // gentle mouse parallax for the register backdrop (Ken Burns drift lives in CSS)
    (function () {
      var bg = document.querySelector(".login-bg");
      if (!bg) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

      var raf = 0;
      var x = 0;
      var y = 0;

      function apply() {
        raf = 0;
        if (window.innerWidth < 640) return; // phones keep the calmer static zoom
        bg.style.translate = String(-x * 7) + "px " + String(-y * 7) + "px";
      }

      window.addEventListener("mousemove", function (event) {
        x = (event.clientX / window.innerWidth - 0.5) * 2;
        y = (event.clientY / window.innerHeight - 0.5) * 2;
        if (!raf) raf = requestAnimationFrame(apply);
      });
    })();
  </script>
  <script src="../chatbot/widget/plantora-chat.js" data-api="http://localhost:3001/api/chat" defer></script>
</body>
</html>
