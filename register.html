<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Plantora</title>

  <!-- Same fonts as the rest of Plantora -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Reuse the shared Plantora theme: colors, fonts, .btn styles -->
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js" defer></script>

  <style>
    /* =============================================================
       REGISTER PAGE — page-specific styles
       -------------------------------------------------------------
       Kept inline here since no second CSS file is allowed.
       Colors/fonts reuse the variables already defined in
       style.css's :root (with safe fallbacks, just in case).
       ============================================================= */

    .register-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      background-color: var(--color-bg, #f6f8f1);
    }

    .register-back-link {
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 1.75rem;
      font-family: var(--font-body, "Inter", sans-serif);
      font-size: 0.9rem;
      color: var(--color-text-muted, #5c6355);
    }

    .register-back-link:hover {
      color: var(--color-primary, #2d5a3d);
    }

    .register-card {
      background-color: #ffffff;
      border: 1px solid var(--color-border, #dce4d2);
      border-radius: 20px;
      box-shadow: 0 20px 40px -20px rgba(23, 48, 31, 0.25);
      padding: 2.75rem 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .register-card__logo {
      font-family: var(--font-heading, "Fraunces", serif);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--color-primary, #2d5a3d);
      margin-bottom: 1.5rem;
    }

    .register-card h1 {
      font-family: var(--font-heading, "Fraunces", serif);
      color: var(--color-primary, #2d5a3d);
      font-size: 1.75rem;
      margin-bottom: 0.6rem;
    }

    .register-card__intro {
      font-family: var(--font-body, "Inter", sans-serif);
      color: var(--color-text-muted, #5c6355);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .register-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-family: var(--font-body, "Inter", sans-serif);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-primary, #2d5a3d);
    }

    .form-group input {
      font-family: var(--font-body, "Inter", sans-serif);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border, #dce4d2);
      border-radius: 10px;
      background-color: var(--color-bg, #f6f8f1);
      color: var(--color-text, #2b2b26);
    }

    .form-group input:focus-visible {
      outline: 2px solid var(--color-secondary, #6fa25a);
      outline-offset: 2px;
    }

    /* Make the shared .btn class behave properly on a <button> element */
    .register-form .btn {
      width: 100%;
      text-align: center;
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .register-card__login {
      font-family: var(--font-body, "Inter", sans-serif);
      font-size: 0.9rem;
      color: var(--color-text-muted, #5c6355);
    }

    .register-card__login a {
      color: var(--color-secondary, #6fa25a);
      font-weight: 600;
    }

    .register-card__login a:hover {
      color: var(--color-primary, #2d5a3d);
    }

    .register-note {
      margin-top: 1.5rem;
      font-family: var(--font-body, "Inter", sans-serif);
      font-size: 0.8rem;
      color: var(--color-text-muted, #5c6355);
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="register-page">

    <a href="index.html" class="register-back-link">&larr; Back to Home</a>

    <div class="register-card">
      <p class="register-card__logo">🌿 Plantora</p>

      <h1>Create Account</h1>
      <p class="register-card__intro">
        Join Plantora to get personalized plant recommendations and manage your plants.
      </p>

      <form class="register-form" id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" />
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm your password" />
        </div>

        <button type="submit" class="btn btn--primary">Create Account</button>
      </form>

      <p class="register-card__login">
        Already have an account? <a href="login.html">Log In</a>
      </p>
    </div>

    <p class="register-note">This is an early prototype — registration is not yet functional.</p>
  </div>

</body>
</html>
